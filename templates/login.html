{% extends 'base.html' %}

{% block title %}Login | TiakiNet{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card">

        <!-- Header -->
        <div class="text-center mb-4">
            <div class="form-icon-wrap mb-3">
                <i class="bi bi-box-arrow-in-right"></i>
            </div>
            <h4 class="form-title">Welcome back</h4>
        </div>

        <form method="POST" action="{{ url_for('login') }}" novalidate id="login-form">

            <div class="form-field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       value="{{ username or '' }}"
                       required autofocus>
                <div class="invalid-feedback">Please enter your username.</div>
            </div>

            <div class="form-field">
                <label for="password">Password</label>
                <div class="position-relative">
                    <input type="password" id="password" name="password" required
                           style="padding-right: 2.8rem;">
                    <button type="button" tabindex="-1"
                            class="position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent me-2 p-0"
                            style="color: var(--text-light); cursor:pointer; font-size:1.1rem; line-height:1;"
                            id="pw-toggle" aria-label="Show password">
                        <i class="bi bi-eye-fill" id="pw-icon"></i>
                    </button>
                </div>
                <div class="invalid-feedback">Please enter your password.</div>
            </div>

            <button type="submit" class="form-btn mt-3">
                Login <i class="bi bi-arrow-right ms-1"></i>
            </button>

        </form>

        <p class="form-footer-text">
            Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
        </p>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// ── Eye toggle ──────────────────────────────────────────────────────
document.getElementById('pw-toggle').addEventListener('click', function () {
    const input = document.getElementById('password');
    const icon  = document.getElementById('pw-icon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash-fill';
    } else {
        input.type = 'password';
        icon.className = 'bi bi-eye-fill';
    }
});

// ── Submit validation ───────────────────────────────────────────────
document.getElementById('login-form').addEventListener('submit', function(e) {
    if (!this.checkValidity()) {
        e.preventDefault();
        e.stopPropagation();
    }
    this.classList.add('was-validated');
});
</script>
{% endblock %}
